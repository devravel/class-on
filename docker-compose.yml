version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: classon_db_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_segura_da_etec
      POSTGRES_DB: classon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Garante que os dados não sumam ao desligar

volumes:
  postgres_data:
